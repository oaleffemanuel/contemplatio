name: contemplatio
description: "App de contemplação dos mistérios do Rosário e Via Sacra."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Persistência para salvar onde o usuário parou na oração
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Gerador automático de ícones para iOS e Android
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0

# Configuração do Ícone do App (Estilo Liquid Glass)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0B1A3A" # Seu Azul Mariano
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  # Declaração da pasta de imagens para o PageView e a Logo
  assets:
    - assets/images/